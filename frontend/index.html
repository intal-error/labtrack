<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!--
      Pre-paint theme bootstrap. Runs before any stylesheet so the very first
      frame is already the correct theme: without it the page paints white,
      then cream (global.css loads with no theme class), then jumps to dark
      once ThemeContext's useEffect runs.

      Only <html> can be classed here - document.body is still null while
      <head> is being parsed. The dark tokens in global.css are keyed to
      :root.dark for exactly this reason, so no second class is needed.

      The inline background bridges the gap before global.css is applied. In
      production that stylesheet is a render-blocking <link> so it wins on
      cascade; in dev Vite injects it via JS, so this is what prevents a
      white frame before the CSS lands.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark" : true; // matches ThemeContext default
          if (dark) {
            document.documentElement.classList.add("dark");
          }
          var s = document.createElement("style");
          s.textContent = "html{background:" + (dark ? "#000000" : "#f5f5f0") + "}";
          document.head.appendChild(s);
        } catch (e) {
          /* private mode / storage disabled - fall through to defaults */
        }
      })();
    </script>

    <title>SLSU LabTrack</title>
    <meta name="description" content="SLSU Laboratory Equipment Borrowing, Return &amp; Logbook Attendance System" />

    <link rel="icon" type="image/png" href="/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />

    <!-- Two tags: UA picks the one matching the system scheme. The bootstrap
         script above rewrites the non-media tag when the user has explicitly
         toggled, so chrome tracks the real preference. -->
    <meta name="theme-color" content="#04140c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#04140c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LabTrack" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="LabTrack" />
    <meta name="msapplication-TileColor" content="#1a1a2e" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Prevent iOS zoom on input focus -->
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Windows Phone -->
    <meta name="msapplication-navbutton-color" content="#1a1a2e" />
    
    <!-- UC Browser -->
    <meta name="browsermode" content="application" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
